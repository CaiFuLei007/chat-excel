# chat-excel 各子服务 gflags 参数配置文件(gflags flagfile 格式)
# 各子服务启动时通过 --conf 参数指定本文件(默认工作目录下的 chat_data.conf),
# 子服务已定义的参数会被本文件的配置覆盖, 子服务未定义的参数自动忽略;
# 相同的配置参数(MySQL/Redis/日志/Etcd 等)只配置一次,
# 各子服务将来在独立的容器中运行, 端口号/服务名称/服务器地址等参数由各容器单独配置

# ================= 日志 =================

# 日志输出文件路径, "stdout" 表示输出到标准输出, 其他值为日志文件路径
--logger_file=stdout
# 日志输出级别, 可选值 : trace / debug / info / warn / error / critical
--log_level=info

# ================= MySQL =================

--mysql_host=127.0.0.1
--mysql_port=3306
--mysql_user=root
--mysql_password=
--mysql_database=chat_excel
--mysql_charset=utf8
--mysql_connection_pool_size=3

# ================= Redis =================

--redis_host=127.0.0.1
--redis_port=6379
--redis_user=default
--redis_password=
--redis_db=0
--redis_pool_connections_size=3

# ================= Etcd =================

--etcd_address=http://127.0.0.1:2379

# 服务注册 TTL(秒)
--registry_ttl=10

# ================= 子服务名称 =================
# 各子服务注册到 ETCD 注册中心的名称, 子服务间 RPC 调用通过该名称获取通信信道

--user_service=UserService
--file_service=FileService
--gateway_service=GatewayService
--ai_service=AIService
--excel_parse_service=ExcelParseService
--notify_service=NotifyService
--database_service=DataBaseService

# ================= 子服务监听参数 =================
# 各子服务容器单独配置, 需与子服务自身的默认参数名保持一致 :
# --listen_port 监听端口, --server_name 注册服务名称, --server_addr 注册地址(须与 host:listen_port 一致)

--listen_port=8081
--server_name=UserService
--server_addr=127.0.0.1:8081

# ================= FastDFS =================

# FastDFS tracker 服务器地址列表(逗号分隔)
--fdfs_tracker_servers=127.0.0.1:22122

# ================= 子服务特有参数 =================
# 以下参数由对应子服务单独定义, 其他子服务读取时自动忽略

# 需要监控的子服务名称列表(逗号分隔, 用户/文件/数据库/AI 子服务各自单独配置)
--care_service_names=NotifyService,DataBaseService

# ChatSDK 本地 SQLite 数据库文件路径(AI 子服务)
--chat_sdk_db_path=aichat_sdk.db

# 邮箱用户名/授权码/发送者邮件号/SMTP 服务器地址/工作线程个数(通知子服务)
--smtp_username=
--smtp_password=
--from_email=
--smtp_server=smtp.qq.com:465
--worker_thread_count=3

# 前端静态文件根目录(网关服务)
--www_root=www
